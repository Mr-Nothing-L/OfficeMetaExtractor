name: Build Windows Installer

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==69.0.3
          pip install -r requirements.txt
          pip install PyInstaller

      - name: Build Cython extension
        run: python build/build_pyd.py

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --name=OfficeMetaExtractor --onefile --windowed --noconfirm --clean --distpath=dist --workpath=build/pyinstaller --specpath=build/pyinstaller --paths=src --collect-all src --collect-all docx --collect-all openpyxl --collect-all pptx --collect-all olefile --collect-all PyPDF2 --hidden-import=PyQt5.sip --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtGui --hidden-import=PyQt5.QtWidgets --hidden-import=src.audit --hidden-import=src.audit.company_extractor --hidden-import=src.audit.detector --hidden-import=src.audit.report_generator --hidden-import=src.parsers.csv_parser --hidden-import=src.parsers.base_parser --hidden-import=src.parsers.docx_parser --hidden-import=src.parsers.xlsx_parser --hidden-import=src.parsers.pptx_parser --hidden-import=src.parsers.ole_parser --hidden-import=src.parsers.pdf_parser --hidden-import=src.utils.datamodel --hidden-import=src.utils.logger --hidden-import=src.utils.config main.py

      - name: Download and install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer with Inno Setup
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc build\OfficeMetaExtractor.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeMetaExtractor-Setup
          path: output\OfficeMetaExtractor_Setup.exe
          retention-days: 90

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output\OfficeMetaExtractor_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
