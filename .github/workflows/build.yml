name: Build Windows EXE

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyInstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --name=OfficeMetaExtractor --onefile --windowed --noconfirm --clean --distpath=dist --workpath=build/pyinstaller --specpath=build/pyinstaller --paths=src --collect-all src --collect-all docx --collect-all openpyxl --collect-all pptx --collect-all olefile --collect-all PyPDF2 --hidden-import=PyQt5.sip --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtGui --hidden-import=PyQt5.QtWidgets main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeMetaExtractor-windows
          path: dist/OfficeMetaExtractor.exe
          retention-days: 30

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OfficeMetaExtractor.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
